# Cabeceras de seguridad de cada página y archivo estático. Se incluye en cada
# location que define su propio add_header, porque nginx descarta los
# heredados en cuanto una location declara uno.
#
# CSP (contra XSS):
#  - scripts solo del propio sitio (public/tema.js y el bundle de Vite), nada
#    en línea ni eval;
#  - estilos del sitio y de Google Fonts, sin estilos en línea;
#  - Trusted Types: ninguna cadena puede convertirse en HTML o script desde
#    JavaScript (bloquea los XSS basados en el DOM en Chrome y Edge);
#  - sin frames, plugins, ni formularios hacia otros sitios.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
