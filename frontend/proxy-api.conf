# Común a las locations del API (se incluye después de proxy_pass).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_hide_header X-Powered-By;
proxy_connect_timeout 5s;
# Un listado consulta a todas las instancias (máximo ~6 s) y un PDF grande tarda.
proxy_read_timeout 30s;
proxy_intercept_errors off;
error_page 413 = @api_too_large;
error_page 429 = @api_rate_limited;
error_page 502 504 = @api_down;
