<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>404 · Página no encontrada · Portal de Descargas FluxoIA</title>
  <link rel="icon" href="/marca/favicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <!-- Página que sirve el nginx cuando el error lo produce él (rutas inválidas,
       sondeos de archivos). Autónoma: sin scripts, solo estilos propios. -->
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#0a1220;color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden;position:relative}
    .aurora{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
    .a1{width:55vmax;height:55vmax;left:-12%;top:-22%;background:rgba(37,99,235,.32)}
    .a2{width:46vmax;height:46vmax;right:-16%;top:18%;background:rgba(124,58,237,.26)}
    .a3{width:40vmax;height:40vmax;left:25%;bottom:-30%;background:rgba(2,206,255,.16)}
    .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at 30% 20%,#000 20%,transparent 70%);mask-image:radial-gradient(ellipse at 30% 20%,#000 20%,transparent 70%)}
    header,main,footer{position:relative;z-index:1}
    header{padding:22px 28px;display:flex;align-items:center;gap:10px}
    header img{width:36px;height:36px}
    header span{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:18px}
    main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:720px;margin:0 auto;padding:24px 28px}
    .eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#02ceff;display:flex;align-items:center;gap:8px}
    .eyebrow i{width:6px;height:6px;border-radius:50%;background:#f0643b;display:inline-block}
    .code{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:clamp(96px,22vw,160px);line-height:1;margin:8px 0 0;background:linear-gradient(100deg,#02ceff 0%,#60a5fa 45%,#a78bfa 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
    h1{font-family:'Space Grotesk',Inter,sans-serif;font-size:clamp(26px,4vw,38px);margin:8px 0 0}
    p.text{color:rgba(255,255,255,.75);line-height:1.6;font-size:16px;max-width:520px;margin:14px 0 0}
    .actions{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px}
    a.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:600;font-size:14px;text-decoration:none}
    a.primary{background:#2563eb;color:#fff;box-shadow:0 24px 56px -28px rgba(37,99,235,.9)}
    a.primary:hover{background:#1d4ed8}
    a.glass{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff}
    a.glass:hover{background:rgba(255,255,255,.16)}
    footer{text-align:center;font-size:12px;color:rgba(255,255,255,.5);padding:20px}
  </style>
</head>
<body>
  <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div><div class="grid"></div>
  <header><img src="/marca/logo-fluxo.png" alt="" /><span>FluxoIA</span></header>
  <main>
    <div class="eyebrow"><i></i> Error 404 · Página no encontrada</div>
    <div class="code">404</div>
    <h1>Esta página no existe</h1>
    <p class="text">La dirección está mal escrita o cambió. Sus comprobantes siguen a salvo: vuelva al inicio para verlos.</p>
    <div class="actions">
      <a class="btn primary" href="/">← Ir al portal</a>
      <a class="btn glass" href="https://wa.me/593960608410" rel="noopener noreferrer">Soporte 096 060 8410</a>
    </div>
  </main>
  <footer>© 2026 FLUXOERP S.A.S.</footer>
</body>
</html>
