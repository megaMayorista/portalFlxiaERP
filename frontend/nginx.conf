# =====================================================================
#  Portal de descargas — nginx del contenedor (SPA + proxy de /api)
#
#  Primera línea de defensa. Lo que parece un ataque se corta aquí con 403
#  antes de llegar al backend, que vuelve a revisarlo (CortafuegosFilter).
#  Las respuestas de error usan SIEMPRE las vistas de la app:
#    - 404: la dirección no existe;
#    - 403: la petición es un intento de ataque o un sondeo (inyección SQL,
#      XSS, rutas anidadas o codificadas, archivos sensibles, escáneres).
# =====================================================================

# IP real del cliente. En producción llega desde el nginx del host, que pone
# X-Real-IP con la dirección que vio; solo se le cree a redes privadas (el
# host y la red de Docker), así nadie de afuera puede inventarse una IP.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

# Rutas anidadas o con trucos en la línea cruda, antes de que nginx las
# normalice: barras o puntos codificados, barra invertida, NUL, segmentos
# "." y "..", y barras dobles.
map $request_uri $bad_path {
    default 0;
    "~*^[^?]*(%2f|%5c|%2e|%00|//|/\.\.?(/|$))" 1;
}

# Firmas de inyección SQL, XSS, Log4Shell y lectura de archivos del sistema,
# en la ruta y en los parámetros, escritas tal cual o codificadas.
map $request_uri $attack {
    default 0;
    "~*(<|%3c)(\s|%20|%09)*/?(script|svg|iframe|img|object|embed|style|link|meta|body)" 1;
    "~*(javascript|vbscript)(\s|%20)*(:|%3a)" 1;
    "~*on(error|load|mouseover|focus|click|toggle)(\s|%20)*(=|%3d)" 1;
    "~*union(\s|\+|%20|%09|%0a|/\*|%2f%2a)+(all(\s|\+|%20)+)?select\b" 1;
    "~*(information_schema|pg_catalog|pg_sleep|sleep(\(|%28)|benchmark(\(|%28)|waitfor(\s|\+|%20)+delay)" 1;
    "~*(%27|')(\s|\+|%20)*(or|and)(\s|\+|%20)" 1;
    "~*(;|%3b)(\s|\+|%20)*(drop|delete|insert|update|alter|truncate|shutdown)(\s|\+|%20)" 1;
    "~*(\{|%7b)jndi(:|%3a)" 1;
    "~*(etc/passwd|etc%2fpasswd|proc/self|win\.ini|boot\.ini)" 1;
    "~*(\.\.|%2e%2e)(/|%2f|%5c)" 1;
}

# Herramientas de ataque que se anuncian en el User-Agent.
map $http_user_agent $bad_agent {
    default 0;
    "~*(sqlmap|nikto|nmap|masscan|acunetix|nessus|openvas|wpscan|dirbuster|gobuster|ffuf|feroxbuster|zgrab|nuclei|havij|w3af|arachni|netsparker|whatweb|jorgee)" 1;
}

map "$bad_path$attack$bad_agent" $blocked {
    default 1;
    "000" 0;
}

# ¿La pide el navegador como página (barra de direcciones) o la app con fetch?
map $http_sec_fetch_dest $is_navigation {
    default 0;
    document 1;
    iframe 1;
    frame 1;
    embed 1;
    object 1;
}

# Qué contestar en /api/: bloqueado + página → vista 403; bloqueado + fetch →
# JSON 403 (la app pasa sola a su vista 403); el API abierto en el navegador →
# vista 404 (no es navegable: las descargas van por fetch).
map "$blocked$is_navigation" $api_verdict {
    default "";
    "11" html403;
    "10" json403;
    "01" html404;
}

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
# Ingreso y recuperar: además de los límites del backend (por cédula y por IP,
# guardados en la base), un freno de ráfagas aquí.
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=pages_per_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    large_client_header_buffers 4 8k;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn connections_per_ip 30;

    if ($request_method !~ ^(GET|HEAD|POST|PUT)$) {
        return 405;
    }

    include /etc/nginx/snippets/cabeceras-seguridad.conf;

    # Las vistas de error son la MISMA app: 403.html y 404.html son copias de
    # index.html con <meta name="portal-error"> (las genera el Dockerfile), así
    # que se ven exactamente igual que las de React. El API conserva sus
    # errores en JSON (proxy_intercept_errors off).
    error_page 400 403 405 /403.html;
    error_page 404 /404.html;
    location = /403.html {
        internal;
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-store" always;
    }
    location = /404.html {
        internal;
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-store" always;
    }
    # Destinos internos para las peticiones al API abiertas como página.
    location = /__403 {
        internal;
        return 403;
    }
    location = /__404 {
        internal;
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Archivos ocultos (.env, .git...) y sondeos de otros sistemas: es un
    # intento de ataque, no una página perdida → 403.
    location ~ /\.(?!well-known/) {
        return 403;
    }
    location ~* \.(php\d?|phtml|asp|aspx|jsp|cgi|pl|py|sh|sql|bak|old|orig|swp|ini|log|env|conf|yml|yaml|toml|lock|git|htaccess|htpasswd)$ {
        return 403;
    }
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc|phpmyadmin|pma|adminer|cgi-bin|vendor|server-status|actuator|console|solr|jmx-console|manager)(/|$) {
        return 403;
    }

    # El índice nunca se guarda en caché: tras un despliegue llega el bundle nuevo.
    location = /index.html {
        if ($blocked) { return 403; }
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Archivos con hash de Vite: caché para siempre.
    location ^~ /assets/ {
        if ($blocked) { return 403; }
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /marca/ {
        if ($blocked) { return 403; }
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    location = /tema.js {
        if ($blocked) { return 403; }
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ^~ /api/auth/ {
        if ($api_verdict = html403) { rewrite ^ /__403 last; }
        if ($api_verdict = html404) { rewrite ^ /__404 last; }
        if ($api_verdict = json403) { return 403; }
        limit_req zone=auth_per_ip burst=10 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_url http://backend:8080;
        proxy_pass $backend_url;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # API: el backend pone sus propias cabeceras de seguridad.
    location ^~ /api/ {
        if ($api_verdict = html403) { rewrite ^ /__403 last; }
        if ($api_verdict = html404) { rewrite ^ /__404 last; }
        if ($api_verdict = json403) { return 403; }
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_req_status 429;
        # Resuelto en cada petición por el DNS de Docker: si el backend se
        # recrea (IP nueva) el sitio sigue funcionando, sin 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_url http://backend:8080;
        proxy_pass $backend_url;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location @api_forbidden {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 403 '{"status":403,"code":"FORBIDDEN","message":"Solicitud bloqueada por seguridad."}';
    }

    location @api_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"status":413,"code":"TOO_LARGE","message":"La solicitud es demasiado grande."}';
    }

    location @api_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
        return 429 '{"status":429,"code":"TOO_MANY_ATTEMPTS","message":"Demasiadas solicitudes seguidas. Espere unos segundos e inténtelo de nuevo."}';
    }

    location @api_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"status":503,"code":"UNAVAILABLE","message":"El portal se está actualizando. Inténtelo de nuevo en un minuto."}';
    }

    # Las pantallas de la app. Solo estas direcciones existen: cualquier otra
    # es un 404 de verdad (código HTTP incluido), con la misma vista de React.
    location ~ ^/(ingreso|recuperar|comprobantes|perfil)?/?$ {
        if ($blocked) { return 403; }
        limit_req zone=pages_per_ip burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # Abierta directamente, la vista 403 responde también con código 403.
    location = /acceso-denegado {
        return 403;
    }

    location / {
        if ($blocked) { return 403; }
        limit_req zone=pages_per_ip burst=60 nodelay;
        limit_req_status 429;
        return 404;
    }
}
