# =====================================================================
#  Portal de descargas — nginx del contenedor (SPA + proxy de /api)
# =====================================================================

# IP real del cliente. En producción llega desde el nginx del host, que pone
# X-Real-IP con la dirección que vio; solo se le cree a redes privadas (el
# host y la red de Docker), así nadie de afuera puede inventarse una IP.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

# Trucos de ruta (barras o puntos codificados, NUL, segmentos ..) en la línea
# cruda, antes de que nginx los normalice. Se revisa dentro de cada location.
map $request_uri $bad_path {
    default 0;
    "~*^[^?]*(%2f|%5c|%2e|%00|/\.\.?(/|$))" 1;
}

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
# Ingreso y recuperar: además de los límites del backend (por cédula y por IP,
# guardados en la base), un freno de ráfagas aquí.
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=pages_per_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn connections_per_ip 30;

    if ($request_method !~ ^(GET|HEAD|POST|PUT)$) {
        return 405;
    }

    include /etc/nginx/snippets/cabeceras-seguridad.conf;

    # Vistas propias (identidad Fluxo) para los errores que produce el mismo
    # nginx: sondeos de archivos, rutas con trucos, métodos no permitidos. Las
    # rutas inexistentes de la app las resuelve React (su propia vista 404) y
    # el API conserva sus errores en JSON (proxy_intercept_errors off).
    error_page 403 405 /403.html;
    error_page 400 404 /404.html;
    location = /403.html {
        internal;
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-store" always;
    }
    location = /404.html {
        internal;
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-store" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Archivos ocultos (.env, .git...) y sondeos de otros sistemas: nunca.
    location ~ /\.(?!well-known/) {
        return 404;
    }
    location ~* \.(php\d?|phtml|asp|aspx|jsp|cgi|pl|py|sh|sql|bak|old|orig|swp|ini|log|env|conf|yml|yaml|toml|lock|git)$ {
        return 404;
    }
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc|phpmyadmin|pma|cgi-bin|vendor|server-status)(/|$) {
        return 404;
    }

    # El índice nunca se guarda en caché: tras un despliegue llega el bundle nuevo.
    location = /index.html {
        if ($bad_path) { return 400; }
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Archivos con hash de Vite: caché para siempre.
    location ^~ /assets/ {
        if ($bad_path) { return 400; }
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /marca/ {
        if ($bad_path) { return 400; }
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    location = /tema.js {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ^~ /api/auth/ {
        if ($bad_path) { return 400; }
        limit_req zone=auth_per_ip burst=10 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_url http://backend:8080;
        proxy_pass $backend_url;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # API: el backend pone sus propias cabeceras de seguridad.
    location ^~ /api/ {
        if ($bad_path) { return 400; }
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_req_status 429;
        # Resuelto en cada petición por el DNS de Docker: si el backend se
        # recrea (IP nueva) el sitio sigue funcionando, sin 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_url http://backend:8080;
        proxy_pass $backend_url;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location @api_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"status":413,"code":"TOO_LARGE","message":"La solicitud es demasiado grande."}';
    }

    location @api_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
        return 429 '{"status":429,"code":"TOO_MANY_ATTEMPTS","message":"Demasiadas solicitudes seguidas. Espere unos segundos e inténtelo de nuevo."}';
    }

    location @api_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"status":503,"code":"UNAVAILABLE","message":"El portal se está actualizando. Inténtelo de nuevo en un minuto."}';
    }

    # SPA: cualquier otra ruta es una pantalla de React.
    location / {
        if ($bad_path) { return 400; }
        limit_req zone=pages_per_ip burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
