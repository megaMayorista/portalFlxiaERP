# =====================================================================
#  nginx del HOST para el portal de descargas
#  Destino: /etc/nginx/sites-available/portal.flxia.net
#           (enlace en sites-enabled). certbot --nginx le agrega el 443,
#           los certificados y la redirección de http a https.
#
#  El contenedor portal_frontend escucha solo en 127.0.0.1:3035.
#  X-Real-IP lleva la IP real del cliente: el portal cuenta los intentos de
#  ingreso por IP, así que tiene que ser la del cliente y no la del proxy.
# =====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name www.portal.flxia.net portal.flxia.net;

    server_tokens off;
    client_max_body_size 16k;

    # Solo se envía por https (los navegadores la ignoran en http).
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3035;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
    }
}
